services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hooma
    ports:
      - '5432:5432'
    volumes:
      - hooma_pg:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
volumes:
  hooma_pg:

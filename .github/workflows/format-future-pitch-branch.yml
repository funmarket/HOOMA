name: Format Future Pitch Branch

on:
  push:
    branches:
      - feat/future-pitch-theme

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/future-pitch-theme
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier formatting
        run: npx prettier --write apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts apps/miniapp/src/pages/SettingsPage.tsx packages/contracts/src/identity.ts docs/WHISTLE_LIVING_PLAN.md
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts apps/miniapp/src/pages/SettingsPage.tsx packages/contracts/src/identity.ts docs/WHISTLE_LIVING_PLAN.md
          git commit -m "style: apply repository formatting"
          git push origin HEAD:feat/future-pitch-theme

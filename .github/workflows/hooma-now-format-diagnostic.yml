name: HOOMA NOW Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write \
            apps/api/src/modules/communities/application/hooma-now-ranking.ts \
            apps/api/src/modules/communities/infrastructure/hooma-now-read-model.ts \
            apps/miniapp/src/types/hooma-now.ts \
            tests/hooma-now-ranking.test.ts
          git diff -- \
            apps/api/src/modules/communities/application/hooma-now-ranking.ts \
            apps/api/src/modules/communities/infrastructure/hooma-now-read-model.ts \
            apps/miniapp/src/types/hooma-now.ts \
            tests/hooma-now-ranking.test.ts

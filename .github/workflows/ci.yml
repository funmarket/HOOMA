name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ci?schema=public
      REDIS_URL: redis://localhost:6379
      TELEGRAM_BOT_TOKEN: ci-placeholder
      TELEGRAM_WEBHOOK_SECRET: ci-placeholder
      DEV_AUTH_BYPASS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run deploy:preflight
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate:deploy
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run format:check
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run security:check
      - run: npm run db:migration:check
